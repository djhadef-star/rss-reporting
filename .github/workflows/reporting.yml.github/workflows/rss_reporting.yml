name: RSS Collector Workflow

on:
  schedule:
    # S'exécute toutes les 2 heures (à la minute 0)
    - cron: '0 */2 * * *'
  # Permet le déclenchement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reporting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pandas requests beautifulsoup4

      - name: Run RSS collector with categories
        run: |
          python rss_multi_sites_categories.py

      - name: Commit updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git diff-index --quiet HEAD || git commit -m "Update RSS history [skip ci]"
          git push
