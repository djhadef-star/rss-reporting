name: RSS Reporting

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Autorise GitHub Actions à modifier le dépôt (nécessaire pour git push)
permissions:
  contents: write

jobs:
  reporting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pandas

      - name: Run RSS collector with categories
        run: python rss_multi_sites_categories.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/rss_history.csv
          git commit -m "Update RSS CSV (reporting)" || echo "Aucun changement à commiter"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
